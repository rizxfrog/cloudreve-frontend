<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <title>趴在云朵上的可爱小羊</title>

  <!-- 背景 -->
  <rect width="800" height="540" fill="#F7F8FA"/>

  <!-- 左上角黄色点缀 -->
  <g stroke="#F2C14E" stroke-width="20" stroke-linecap="round">
    <line x1="172" y1="120" x2="196" y2="158"/>
    <line x1="113" y1="168" x2="160" y2="192"/>
    <line x1="97"  y1="236" x2="150" y2="232"/>
  </g>

  <g stroke="#4A2C1E" stroke-linecap="round" stroke-linejoin="round">

    <!-- 身体羊毛 -->
    <path fill="#FBF4ED" stroke-width="11" d="M300,155
      A55,55 0 0 1 390,185 A55,55 0 0 1 440,265 A55,55 0 0 1 440,360
      A55,55 0 0 1 390,440 A55,55 0 0 1 300,465 A55,55 0 0 1 215,440
      A55,55 0 0 1 165,360 A55,55 0 0 1 165,265 A55,55 0 0 1 215,185
      A55,55 0 0 1 300,155 Z"/>

    <!-- 右耳 -->
    <g transform="rotate(-15 568 162)">
      <ellipse cx="568" cy="162" rx="72" ry="40" fill="#FBEFE4" stroke-width="11"/>
      <ellipse cx="578" cy="162" rx="42" ry="19" fill="#F6B5B1" stroke="none"/>
    </g>

    <!-- 脸 -->
    <ellipse cx="435" cy="265" rx="120" ry="100" fill="#FBEFE4" stroke-width="11"/>

    <!-- 左耳（垂耳） -->
    <g transform="rotate(35 272 300)">
      <ellipse cx="272" cy="300" rx="40" ry="62" fill="#FBEFE4" stroke-width="11"/>
      <ellipse cx="268" cy="308" rx="19" ry="38" fill="#F6B5B1" stroke="none"/>
    </g>

    <!-- 头顶羊毛 -->
    <path fill="#FDFAF5" stroke-width="11" d="M400,55
      A45,45 0 0 1 480,70 A45,45 0 0 1 540,110 A45,45 0 0 1 560,170
      A45,45 0 0 1 505,205 A45,45 0 0 1 430,215 A45,45 0 0 1 350,215
      A45,45 0 0 1 275,200 A45,45 0 0 1 235,150 A45,45 0 0 1 270,95
      A45,45 0 0 1 330,65 A45,45 0 0 1 400,55 Z"/>

    <!-- 羊毛上的浅色纹理 -->
    <g fill="none" stroke="#EBD9C6" stroke-width="8">
      <path d="M300,148 q10,18 0,30"/>
      <path d="M212,252 q-12,20 0,38"/>
      <path d="M255,392 q14,14 30,10"/>
    </g>

    <!-- 眼睛 -->
    <ellipse cx="388" cy="282" rx="17" ry="20" fill="#4A2C1E" stroke="none"/>
    <ellipse cx="492" cy="246" rx="17" ry="20" fill="#4A2C1E" stroke="none"/>

    <!-- 腮红 -->
    <circle cx="362" cy="318" r="27" fill="#F8AEBB" stroke="none"/>
    <circle cx="523" cy="262" r="27" fill="#F8AEBB" stroke="none"/>
    <g stroke="#EE8CA0" stroke-width="7">
      <line x1="355" y1="312" x2="359" y2="326"/>
      <line x1="368" y1="310" x2="372" y2="324"/>
      <line x1="516" y1="256" x2="520" y2="270"/>
      <line x1="529" y1="254" x2="533" y2="268"/>
    </g>

    <!-- 鼻子和嘴巴 -->
    <ellipse cx="438" cy="266" rx="10" ry="7" fill="#A5674F" stroke="none"/>
    <path fill="none" stroke-width="9" d="M424,282 Q432,294 441,284 Q450,294 458,282"/>

    <!-- 云朵 -->
    <path fill="#C6DEF7" stroke="#8FBDF2" stroke-width="13" d="M480,330
      A60,60 0 0 1 585,345 A60,60 0 0 1 660,400 A60,60 0 0 1 675,460
      A60,60 0 0 1 610,505 A60,60 0 0 1 520,520 A60,60 0 0 1 420,515
      A60,60 0 0 1 330,495 A60,60 0 0 1 275,445 A60,60 0 0 1 300,385
      A60,60 0 0 1 380,345 A60,60 0 0 1 480,330 Z"/>
    <path fill="none" stroke="#FFFFFF" stroke-width="13" opacity="0.9"
          d="M560,375 q45,-6 62,30"/>

    <!-- 左前蹄 -->
    <g transform="rotate(6 375 356)">
      <rect x="322" y="332" width="106" height="48" rx="24" fill="#FBEFE4" stroke-width="11"/>
      <circle cx="402" cy="356" r="20" fill="#6A4B3A" stroke-width="9"/>
    </g>

    <!-- 右前蹄 -->
    <g transform="rotate(-14 540 324)">
      <rect x="487" y="300" width="106" height="48" rx="24" fill="#FBEFE4" stroke-width="11"/>
      <circle cx="517" cy="324" r="20" fill="#6A4B3A" stroke-width="9"/>
    </g>
  </g>
</svg>